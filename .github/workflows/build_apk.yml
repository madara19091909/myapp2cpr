name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.farmparty --project-name farm_party .
          fi

      - name: Patch Android (INTERNET permission + minSdk 23)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          for F in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$F" ]; then
              sed -i -E 's/minSdk(Version)?( =|) *flutter\.minSdkVersion/minSdk = 23/' "$F"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          ARGS=""
          for V in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET; do
            if [ -n "${!V}" ]; then
              ARGS="$ARGS --dart-define=$V=${!V}"
            fi
          done
          flutter build apk --release $ARGS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-party-apk
          path: build/app/outputs/flutter-apk/app-release.apk
