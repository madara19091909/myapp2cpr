
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.farmparty \
              --project-name farm_party \
              --no-pub \
              .
          fi

          test -f android/app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          }

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android app Gradle file was not generated."
            exit 1
          fi

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"

          echo "Android SDK 36 installed successfully."

      - name: Patch Android configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in text:
              permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'

              text, count = re.subn(
                  r"(?m)^([ \t]*)(<application\b)",
                  lambda match: match.group(1) + permission + match.group(1) + match.group(2),
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "Could not add INTERNET permission to AndroidManifest.xml"
                  )

              manifest.write_text(text, encoding="utf-8")

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next(
              (path for path in candidates if path.is_file()),
              None,
          )

          if gradle is None:
              raise SystemExit("Android app Gradle file was not found.")

          source = gradle.read_text(encoding="utf-8")

          # Set application compileSdk to 36.
          if gradle.suffix == ".kts":
              source, count = re.subn(
                  r"(?m)^(\s*compileSdk\s*=\s*)(?:flutter\.compileSdkVersion|\d+)",
                  r"\g<1>36",
                  source,
                  count=1,
              )
          else:
              source, count = re.subn(
                  r"(?m)^(\s*compileSdkVersion\s+)(?:flutter\.compileSdkVersion|\d+)",
                  r"\g<1>36",
                  source,
                  count=1,
              )

          if count != 1:
              raise SystemExit(
                  f"Could not locate compileSdk setting in {gradle}"
              )

          # Keep minSdk at 23.
          if gradle.suffix == ".kts":
              source, count = re.subn(
                  r"(?m)^(\s*minSdk\s*=\s*)(?:flutter\.minSdkVersion|\d+)",
                  r"\g<1>23",
                  source,
                  count=1,
              )
          else:
              source, count = re.subn(
                  r"(?m)^(\s*minSdkVersion\s+)(?:flutter\.minSdkVersion|\d+)",
                  r"\g<1>23",
                  source,
                  count=1,
              )

          if count != 1:
              raise SystemExit(
                  f"Could not locate minSdk setting in {gradle}"
              )

          gradle.write_text(source, encoding="utf-8")

          print(f"Android configuration patched: {gradle}")
          print("Application compileSdk = 36")
          print("Application minSdk = 23")
          PYCODE

      - name: Configure and validate release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          for NAME in RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            if [ -z "${!NAME:-}" ]; then
              echo "ERROR: GitHub Actions secret $NAME is missing or empty."
              exit 1
            fi
          done

          KEYSTORE="android/app/release-upload-key"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "ERROR: The decoded keystore is empty. Check RELEASE_KEYSTORE_BASE64."
            exit 1
          fi

          STORE_TYPE=""

          if keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" \
              >"$RUNNER_TEMP/keystore-pkcs12.log" 2>&1; then
            STORE_TYPE="PKCS12"
          elif keytool -list -keystore "$KEYSTORE" -storetype JKS \
              -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" \
              >"$RUNNER_TEMP/keystore-jks.log" 2>&1; then
            STORE_TYPE="JKS"
          else
            echo "ERROR: The keystore could not be opened using the supplied store password and alias."
            echo "PKCS12 check:"
            cat "$RUNNER_TEMP/keystore-pkcs12.log"
            echo "JKS check:"
            cat "$RUNNER_TEMP/keystore-jks.log"
            exit 1
          fi

          if ! keytool -certreq -alias "$RELEASE_KEY_ALIAS" \
              -keystore "$KEYSTORE" -storetype "$STORE_TYPE" \
              -storepass:env RELEASE_STORE_PASSWORD \
              -keypass:env RELEASE_KEY_PASSWORD \
              -file "$RUNNER_TEMP/release-signing-check.csr" \
              >"$RUNNER_TEMP/key-password-check.log" 2>&1; then
            echo "ERROR: The keystore was opened, but the key alias/private-key password check failed."
            cat "$RUNNER_TEMP/key-password-check.log"
            exit 1
          fi

          export DETECTED_STORE_TYPE="$STORE_TYPE"

          python3 - <<'PYCODE'
          from pathlib import Path
          import os

          def escape_property(value: str) -> str:
              output = []

              for index, char in enumerate(value):
                  code = ord(char)

                  if char == "\\":
                      output.append("\\\\")
                  elif char == "\t":
                      output.append("\\t")
                  elif char == "\n":
                      output.append("\\n")
                  elif char == "\r":
                      output.append("\\r")
                  elif char == "\f":
                      output.append("\\f")
                  elif char in "=:#!" or (char == " " and index == 0):
                      output.append("\\" + char)
                  elif code < 0x20 or code > 0x7e:
                      encoded = char.encode("utf-16-be")
                      output.extend(
                          f"\\u{int.from_bytes(encoded[i:i+2], 'big'):04x}"
                          for i in range(0, len(encoded), 2)
                      )
                  else:
                      output.append(char)

              return "".join(output)

          values = {
              "storePassword": os.environ["RELEASE_STORE_PASSWORD"],
              "keyPassword": os.environ["RELEASE_KEY_PASSWORD"],
              "keyAlias": os.environ["RELEASE_KEY_ALIAS"],
              "storeFile": "app/release-upload-key",
              "storeType": os.environ["DETECTED_STORE_TYPE"],
          }

          path = Path("android/key.properties")

          path.write_text(
              "".join(
                  f"{key}={escape_property(value)}\n"
                  for key, value in values.items()
              ),
              encoding="iso-8859-1",
          )

          path.chmod(0o600)
          PYCODE

          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next(
              (path for path in candidates if path.is_file()),
              None,
          )

          if gradle is None:
              raise SystemExit("Android app Gradle file was not found.")

          source = gradle.read_text(encoding="utf-8")

          if gradle.suffix == ".kts":
              imports = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n"
              )

              if "import java.util.Properties" not in source:
                  source = imports + source

              properties_code = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          require(keystorePropertiesFile.exists()) { "android/key.properties is missing" }
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          '''

              android_match = re.search(r"\bandroid\s*\{", source)

              if not android_match:
                  raise SystemExit(
                      "Could not locate the android { } block in build.gradle.kts"
                  )

              if "val keystoreProperties = Properties()" not in source:
                  source = (
                      source[:android_match.start()]
                      + properties_code
                      + source[android_match.start():]
                  )

              if "signingConfigs {" not in source:
                  android_match = re.search(r"\bandroid\s*\{", source)
                  insert_at = android_match.end()

                  signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      storeType = keystoreProperties["storeType"] as String
                  }
              }
          '''

                  source = source[:insert_at] + signing + source[insert_at:]

              elif not re.search(r'create\(["\']release["\']\)', source):
                  raise SystemExit(
                      "A pre-existing signingConfigs block was found without a release config; refusing to overwrite it."
                  )

              source = source.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )

              release_match = re.search(
                  r"buildTypes\s*\{\s*release\s*\{",
                  source,
              )

              if not release_match:
                  raise SystemExit(
                      "Could not locate buildTypes { release { } } in build.gradle.kts"
                  )

              if 'signingConfig = signingConfigs.getByName("release")' not in source:
                  insert_at = release_match.end()

                  source = (
                      source[:insert_at]
                      + '\n            signingConfig = signingConfigs.getByName("release")'
                      + source[insert_at:]
                  )

          else:
              properties_code = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (!keystorePropertiesFile.exists()) { throw new GradleException('android/key.properties is missing') }
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          '''

              android_match = re.search(r"\bandroid\s*\{", source)

              if not android_match:
                  raise SystemExit(
                      "Could not locate the android { } block in build.gradle"
                  )

              if "keystoreProperties = new Properties()" not in source:
                  source = (
                      source[:android_match.start()]
                      + properties_code
                      + source[android_match.start():]
                  )

              if "signingConfigs {" not in source:
                  android_match = re.search(r"\bandroid\s*\{", source)
                  insert_at = android_match.end()

                  signing = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile rootProject.file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      storeType keystoreProperties['storeType']
                  }
              }
          '''

                  source = source[:insert_at] + signing + source[insert_at:]

              elif not re.search(r"\brelease\s*\{", source):
                  raise SystemExit(
                      "A pre-existing signingConfigs block was found without a release config; refusing to overwrite it."
                  )

              source = source.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )

              release_match = re.search(
                  r"buildTypes\s*\{\s*release\s*\{",
                  source,
              )

              if not release_match:
                  raise SystemExit(
                      "Could not locate buildTypes { release { } } in build.gradle"
                  )

              if "signingConfig signingConfigs.release" not in source:
                  insert_at = release_match.end()

                  source = (
                      source[:insert_at]
                      + "\n            signingConfig signingConfigs.release"
                      + source[insert_at:]
                  )

          gradle.write_text(source, encoding="utf-8")

          print(
              f"Release signing configured in {gradle} "
              f"using {os.environ.get('DETECTED_STORE_TYPE', 'detected keystore type')}."
          )
          PYCODE

          echo "Release keystore and private-key password checks passed."

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fix file_picker Android compileSdk
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          from urllib.request import url2pathname

          config_path = Path(".dart_tool/package_config.json")

          if not config_path.is_file():
              raise SystemExit(
                  "Flutter package configuration was not found."
              )

          config = json.loads(
              config_path.read_text(encoding="utf-8")
          )

          package = next(
              (
                  item
                  for item in config["packages"]
                  if item["name"] == "file_picker"
              ),
              None,
          )

          if package is None:
              raise SystemExit("file_picker package was not found.")

          root_uri = package["rootUri"]
          parsed = urlparse(root_uri)

          if parsed.scheme == "file":
              package_root = Path(url2pathname(parsed.path))
          elif parsed.scheme:
              raise SystemExit(
                  f"Unsupported file_picker package URI: {root_uri}"
              )
          else:
              package_root = (
                  config_path.parent / unquote(root_uri)
              ).resolve()

          android_dir = package_root / "android"

          if not android_dir.is_dir():
              raise SystemExit(
                  f"file_picker Android directory was not found: {android_dir}"
              )

          gradle_files = (
              list(android_dir.rglob("build.gradle"))
              + list(android_dir.rglob("build.gradle.kts"))
          )

          if not gradle_files:
              raise SystemExit(
                  "No Gradle files were found inside file_picker/android."
              )

          pattern = re.compile(
              r"(?m)^([ \t]*(?:compileSdkVersion|compileSdk)"
              r"(?:[ \t]*=[ \t]*|[ \t]+)).*$"
          )

          patched_files = []

          for gradle in gradle_files:
              source = gradle.read_text(encoding="utf-8")

              updated, count = pattern.subn(
                  lambda match: match.group(1) + "36",
                  source,
              )

              if count > 0:
                  gradle.write_text(updated, encoding="utf-8")
                  patched_files.append(str(gradle))
                  print(f"Updated: {gradle}")

          if not patched_files:
              print("Gradle files found:")

              for gradle in gradle_files:
                  print(f"- {gradle}")

                  for line_number, line in enumerate(
                      gradle.read_text(encoding="utf-8").splitlines(),
                      start=1,
                  ):
                      if "compileSdk" in line:
                          print(f"  Line {line_number}: {line.strip()}")

              raise SystemExit(
                  "Could not find a compileSdk declaration in file_picker. "
                  "The plugin Gradle format may have changed."
              )

          print("file_picker Android compileSdk updated to 36.")
          PYCODE

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart and Flutter sources
        run: flutter analyze

      - name: Run automated tests when present
        shell: bash
        run: |
          set -euo pipefail

          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --reporter expanded
          else
            echo "No Dart test files found; skipping flutter test."
          fi

      - name: Build release APK
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail

          ARGS=()

          for V in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET; do
            if [ -n "${!V:-}" ]; then
              ARGS+=("--dart-define=$V=${!V}")
            fi
          done

          flutter build apk --release "${ARGS[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-party-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
